# 推送和合并请求都执行检查；也可以从 Actions 页面手动运行。
name: Agent Checks

on:
  push:
  pull_request:
  workflow_dispatch:

# 测试只需读取仓库，不允许自动提交或发布。
permissions:
  contents: read

# 同一分支连续推送时，取消过时的检查，节省运行时间。
concurrency:
  group: agent-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python and Vue checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 使用项目已有 uv.lock 恢复后端环境，不另写一份重复的依赖清单。
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            fronted/package-lock.json
            tests/package-lock.json

      # npm ci 按锁文件安装；测试依赖与前端运行依赖分开。
      - name: Install frontend dependencies
        working-directory: fronted
        run: npm ci

      - name: Install browser test dependencies
        working-directory: tests
        run: npm ci

      # 仅在 GitHub 临时 Windows 环境准备 Edge，不改用户本机浏览器。
      - name: Prepare test browser
        working-directory: tests
        run: npx playwright install msedge

      # 复用本地同一入口；失败的退出码会让整个工作流标红。
      - name: Run isolated checks
        run: uv run --no-sync python tests/run_checks.py --browser

      # 即使测试失败，也保留指定的日志和截图，不上传 .env 或 records。
      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-check-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            tests/CHECK_REPORT.md
            tests/_artifacts/*.json
            tests/_artifacts/*.txt
            tests/_artifacts/*.tap
            tests/_artifacts/*.png

